[project]
name = "CRISPRito"
version = "1.0.0"
description = "Multi method CRISPR cut standardization, combination, annotation, and prioritizer."
readme = "README.md"
requires-python = ">=3.10"
#license = {file = "LICENSE"}
authors = [
	{name = "Alexander McFarland"}
]

maintainers = [
	{name = "Alexander McFarland"}
]

classifiers = [
	"Development Status :: 5 - Production/Stable",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
]

dependencies = [
	"biopython==1.85",
	"numpy==2.2.5",
	"pandas",
	"scikit-bio==0.7.3",
	"scipy==1.15.2",
	"pyranges==0.1.4",
	"scikit-learn==1.6.1",
	"tqdm",
]

[project.optional-dependencies]
dev = ["black"]
test = ["pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/agmcfarland/CRISPRito/"
"Bug Reports" = "https://github.com/agmcfarland/CRISPRito/issues"
"Source" = "https://github.com/agmcfarland/CRISPRito/"

[project.scripts]
crisprito-cluster-cuts = "CRISPRito.CRISPRito:main"
crisprito-setup = "CRISPRito.SetupRun:main"
crisprito-process-group = "CRISPRito.ProcessGroup:main"
crisprito-rank-sites = "CRISPRito.RankSites:main"
crisprito-test = "CRISPRito.IntegrationTest:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"